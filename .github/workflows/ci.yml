name: CI

on:
  push:
    branches: [master, develop, 'feature/**']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save time and reduce noise.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (JDK ${{ matrix.jdk }})
    runs-on: ubuntu-latest
    strategy:
      # Do not cancel newer-JDK jobs if another leg fails. Each JDK gives useful signal.
      fail-fast: false
      matrix:
        include:
          - jdk: '9'
            distribution: zulu
          - jdk: '11'
            distribution: corretto
          - jdk: '17'
            distribution: corretto
          - jdk: '21'
            distribution: corretto
          - jdk: '25'
            distribution: corretto
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.jdk }}
          cache: maven

      # JDK 9 is the runtime/test baseline. Build attached Javadocs on newer JDKs,
      # whose TLS and doclet implementations can consume the current external links.
      - name: Verify baseline tests
        if: matrix.jdk == '9'
        run: mvn -B -ntp -Dmaven.javadoc.skip=true verify

      - name: Verify
        if: matrix.jdk != '9'
        run: mvn -B -ntp verify
