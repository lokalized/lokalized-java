name: CI

on:
  push:
    branches: [master, develop, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref to save time and reduce noise.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (JDK ${{ matrix.jdk }})
    runs-on: ubuntu-latest
    strategy:
      # Do not cancel newer-JDK jobs if another leg fails. Each JDK gives useful signal.
      fail-fast: false
      matrix:
        include:
          - jdk: '9'
            distribution: zulu
          - jdk: '11'
            distribution: corretto
          - jdk: '17'
            distribution: corretto
          - jdk: '21'
            distribution: corretto
          - jdk: '25'
            distribution: corretto
          - jdk: '26'
            distribution: oracle
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.jdk }}
          cache: maven

      # Exercise compilation and tests on every supported runtime without requiring historical
      # doclets to consume the current external Javadoc links.
      - name: Verify
        run: mvn -B -ntp -Dmaven.javadoc.skip=true verify

  javadoc:
    name: Javadoc (JDK 26)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '26'
          cache: maven

      - name: Verify Javadocs
        run: mvn -B -ntp -Dmaven.javadoc.failOnWarnings=true verify
